name: Flow

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed]

permissions: {}

jobs:
  move:
    runs-on: ubuntu-latest
    concurrency:
      group: flow-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - id: reader
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Storagie
          repositories: core
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          repository: Storagie/core
          ref: main
          token: ${{ steps.reader.outputs.token }}
          path: core
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Storagie
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
          permission-organization-projects: write

      - run: node core/flow/src/main.ts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
